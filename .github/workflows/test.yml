name: Test
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up PHP
        uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_sqlite, zip, gd
          coverage: none
          tools: composer:v2
      - name: Check PHP source syntax
        run: find app config routes database tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Install and test Laravel
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          cp .env.example .env
          php artisan key:generate
          php artisan view:cache
          php vendor/bin/phpunit
      - name: Test deployment tools
        run: |
          python3 -m py_compile ops/deploy.py ops/webhook.py ops/request-deploy.py
          python3 -m unittest discover -s ops -p 'test_*.py'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: blog-next/package-lock.json
      - name: Build and test Next.js blog
        working-directory: blog-next
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
