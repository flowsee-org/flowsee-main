name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flowsee-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check site and deployment code
        run: |
          test -s felosi-home-before-about-v2.html
          test -d assets
          python3 -m py_compile ops/deploy.py ops/webhook.py ops/request-deploy.py
          python3 -m unittest discover -s ops -p 'test_*.py'
      - name: Publish and verify flowsee.ir
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: python3 ops/request-deploy.py
