name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 46.34.163.250 >> ~/.ssh/known_hosts

      - name: Deploy static site to server
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.github' \
            ./ root@46.34.163.250:/var/www/flowsee-main/
