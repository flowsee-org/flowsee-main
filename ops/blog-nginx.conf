# Add these locations inside the existing flowsee.ir HTTPS server block.
# Laravel continues to serve article detail pages, Studio APIs and the main site.
location = /blog {
    proxy_pass http://127.0.0.1:4180;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_read_timeout 30s;
}
location = /blog/ { return 308 /blog$is_args$args; }
location ^~ /blog/_next/ {
    proxy_pass http://127.0.0.1:4180;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
}
